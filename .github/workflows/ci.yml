# 小程序工程 CI：Windows runner + Node 20 / 22
#
# 跑什么（三步硬门禁，任一失败整个 job 就红）：
#   1. node --test tests      单元测试（零依赖，finance.js 纯函数回归 + 两份 finance.js 哈希一致性）
#   2. static-audit.js        静态 bug 扫描（有「严重」问题才退出 1）
#   3. contrast-audit.js      对比度审计（WCAG 2.1，纯报告，无法解析 WXSS 时才退出 1）
#
# 为什么不跑 compile-check.ps1：
#   它调用微信开发者工具自带的 wcsc.exe / wcc.exe（默认在 D:\<中文目录>\resources\...\wcc-exec），
#   GitHub 托管的 Windows runner 上没有开发者工具，所以在 CI 里必然失败。
#   它不属于 CI 门禁，而是本地门禁：本地跑 `tools\ci.ps1` 会带上它（没装工具时自动 SKIP）。
#   如果以后换成装了开发者工具的 self-hosted runner，把仓库变量 ENABLE_COMPILE 设成 true
#   就会真正执行这一步。
#
# 注意：run: 里的脚本一律用 ASCII，不用中文——Windows PowerShell 对无 BOM 的字面量编码很挑，
# 中文只放在 YAML 注释与 step 名称里（那是 GitHub 解析的，不是 PowerShell 解析的）。

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} / windows-latest
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    defaults:
      run:
        shell: pwsh

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 打印环境版本
        run: |
          node --version
          Write-Host "PSVersion: $($PSVersionTable.PSVersion)"
          Write-Host "workspace: ${{ github.workspace }}"

      # 单元测试
      # 目录形式（不是 glob）：Node 20/22 会递归找 *.test.js；
      # 新版本 Node 把目录当入口时由 tests\index.js 兜底，两种行为都能跑到全部用例。
      - name: 单元测试 node --test
        run: node --test tests

      # 静态审计：只有出现「严重」级问题才退出 1（一般/提示不算失败）
      - name: 静态审计 static-audit.js
        run: node miniprogram/_tools/static-audit.js

      # 对比度审计：产出报告，正常情况下退出 0
      - name: 对比度审计 contrast-audit.js
        run: node miniprogram/_tools/contrast-audit.js

      # 编译校验：CI 跳过（见文件头说明）。
      # 这一条只是把"为什么没跑"写进日志，避免 reviewer 以为漏了一步。
      - name: 编译校验（CI 跳过，说明原因）
        run: |
          Write-Host "::notice title=compile-check skipped::compile-check.ps1 needs wcsc.exe/wcc.exe from WeChat DevTools, which GitHub-hosted runners do not have."
          Write-Host "Local gate (with the compile check) is: tools\ci.ps1"
          Write-Host "This step is NOT part of the CI gate by design."

      # 可选：self-hosted runner 装了开发者工具时，把仓库变量 ENABLE_COMPILE 设为 true 即可执行
      - name: 编译校验 WXSS/WXML（可选，需要微信开发者工具）
        if: vars.ENABLE_COMPILE == 'true'
        run: |
          & .\miniprogram\_tools\compile-check.ps1

      # 把审计报告留在 artifact 里，方便看对比度报告（失败时也上传）
      - name: 上传审计报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-reports-node${{ matrix.node }}
          path: |
            miniprogram/_audit/contrast-report.md
            miniprogram/_audit/contrast-data.json
            miniprogram/_audit/static-audit-result.json
          if-no-files-found: warn
          retention-days: 14
